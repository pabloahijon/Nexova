<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexova | Registro de usuarios</title>
    <link rel="stylesheet" th:href="@{/css/nexova.css}">
</head>
<body class="nx">

<header th:replace="~{fragments/layout :: header}"></header>

<section th:replace="~{fragments/layout :: hero('Nueva cuenta', 'Crea tu cuenta y', 'empieza con Nexova.', 'Regístrate como inquilino para reservar o como propietario para publicar alojamientos.')}"></section>

<main class="narrow">
    <section class="nx-card">
        <div class="nx-card-head">
            <div>
                <h2>Registro</h2>
                <p>Introduce tus datos para crear la cuenta.</p>
            </div>
            <span class="nx-step">Nuevo usuario</span>
        </div>

        <p th:if="${registrationError != null}" th:text="${registrationError}"
           class="nx-msg error" id="registration-error" role="alert"></p>

        <form th:action="@{/users}" th:object="${user}" method="post">
            <div class="nx-field">
                <label>Quiero registrarme como</label>
                <div class="nx-chips">
                    <label class="nx-chip" th:each="r : ${roles}">
                        <input type="radio" th:field="*{role}" th:value="${r}" required>
                        <span th:text="${r.label}">Inquilino</span>
                    </label>
                </div>
            </div>
            <div class="nx-field">
                <label for="name">Nombre</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Ej. Ana Pérez" required>
            </div>
            <div class="nx-field">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" th:field="*{email}" placeholder="tu@correo.es" required>
            </div>
            <div class="nx-field">
                <label for="password">Contraseña (mínimo 8 caracteres)</label>
                <input type="password" id="password" th:field="*{password}" required minlength="8">
            </div>
            <button type="submit" class="nx-btn block">Crear cuenta →</button>
        </form>
        <p class="nx-muted" style="margin-top: 20px; text-align: center;">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
