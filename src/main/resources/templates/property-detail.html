<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexova | Detalle del Inmueble</title>

    <style>
        :root {
            --green: #16825d;
            --green-dark: #0f684a;
            --green-light: #eaf7f1;
            --green-border: #cce8dc;
            --text: #17221e;
            --muted: #6b7772;
            --background: #f6f8f7;
            --white: #ffffff;
            --border: #e3e8e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        header {
            height: 74px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
            color: var(--text);
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: var(--green);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-name {
            font-size: 23px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .brand-name span {
            color: var(--green);
        }

        main {
            width: 86%;
            max-width: 800px;
            margin: 50px auto 80px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: var(--green);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .detail-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(22, 130, 93, 0.06);
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-icon {
            font-size: 40px;
            background: var(--green-light);
            padding: 15px;
            border-radius: 16px;
        }

        .detail-title h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .detail-ref {
            color: var(--muted);
            font-size: 14px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 25px 0;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .info-item label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-item span {
            font-size: 16px;
            font-weight: 650;
        }

        .description-section h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .description-section p {
            color: #4a5568;
            line-height: 1.6;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <header>
        <a class="brand" href="/properties">
            <div class="brand-icon">N</div>
            <div class="brand-name">Nexo<span>va</span></div>
        </a>
    </header>

    <main>
        <a href="/properties" class="back-link">← Volver al listado de inmuebles</a>

        <article class="detail-card">
            <div class="detail-header">
                <div class="detail-icon" th:switch="${property.type}">
                    <span th:case="'PISO'">🏢</span>
                    <span th:case="'CASA'">🏡</span>
                    <span th:case="'PARCELA'">🌳</span>
                    <span th:case="*">🏠</span>
                </div>
                <div class="detail-title">
                    <h1 th:text="${property.title}">Título del inmueble</h1>
                    <span class="detail-ref" th:text="'Ref. NX-' + ${property.id}">Ref. NX-1</span>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label>Ciudad</label>
                    <span th:text="${property.city}">Ciudad</span>
                </div>
                <div class="info-item">
                    <label>Tipo de Inmueble</label>
                    <span th:text="${property.type != null ? property.type : 'No especificado'}">Piso</span>
                </div>
            </div>

            <div class="description-section">
                <h3>Descripción</h3>
                <p th:text="${property.description != null && !property.description.isBlank() ? property.description : 'Sin descripción disponible.'}">
                    Descripción del inmueble...
                </p>
            </div>
        </article>
    </main>

</body>
</html>
