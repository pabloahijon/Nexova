<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Viviendas - Nexova</title>
</head>

<body>

    <h1>Viviendas de Nexova</h1>

    <h2>Añadir vivienda</h2>

    <form th:action="@{/properties}" th:object="${property}" method="post">

        <label for="title">Título:</label>
        <input type="text" id="title" th:field="*{title}" required>

        <br><br>

        <label for="city">Ciudad:</label>
        <input type="text" id="city" th:field="*{city}" required>

        <br><br>

        <button type="submit">Añadir vivienda</button>

    </form>

    <hr>

    <h2>Listado de viviendas</h2>

    <p th:if="${#lists.isEmpty(properties)}">
        Todavía no hay viviendas registradas.
    </p>

    <ul>
        <li th:each="property : ${properties}">
            <strong th:text="${property.title}">Título</strong>
            -
            <span th:text="${property.city}">Ciudad</span>
        </li>
    </ul>

</body>
</html>
